<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Корпоративный портал{% endblock %}</title>
 
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Навигационная панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">MY_COMPANY</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/wall/">Стена</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/colleagues/">Коллеги</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/teams/">Команды</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/useful-info/">Полезная информация</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/time-allocation/">Трудозатраты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/profile/">Кабинет</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
 
    <!-- Основной контент -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
 
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
    {% block extra_js %}{% endblock %}
</body>
</html>
